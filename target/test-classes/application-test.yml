spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 0

webhook:
  secret: test_shared_webhook_secret_key_123

payment:
  reconciliation:
    interval-ms: 600000
    timeout-minutes: 0
