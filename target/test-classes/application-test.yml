spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
  datasource:
    postgres:
      url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
    mysql:
      url: jdbc:h2:mem:testdb_historian;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      driver-class-name: org.h2.Driver
      username: sa
      password:
  jpa:
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: false
  rabbitmq:
    listener:
      type: simple
      simple:
        auto-startup: false

server:
  port: 0

webhook:
  secret: test_shared_webhook_secret_key_123

payment:
  reconciliation:
    interval-ms: 600000
    timeout-minutes: 0
