name: FastPay CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Spring Boot 3.3.4 Test Suite (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Test Suite
        run: mvn test "-Dspring.profiles.active=test"

  frontend-build:
    name: Next.js Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: merchant-frontend/package-lock.json

      - name: Build Merchant Frontend
        run: |
          cd merchant-frontend
          npm ci --legacy-peer-deps
          npm run build

  secret-scan:
    name: Secret Scanning Guardrail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check for Unmasked Secret Key Patterns
        run: |
          echo "Scanning codebase for unmasked API key patterns..."
          if grep -rE "(sk_live_[a-zA-Z0-9]{20,}|sk_test_[a-zA-Z0-9]{20,})" src/ merchant-frontend/ customer-frontend/; then
            echo "ERROR: Unmasked API key secret detected! Aborting build."
            exit 1
          else
            echo "SUCCESS: Zero unmasked secrets detected."
          fi
