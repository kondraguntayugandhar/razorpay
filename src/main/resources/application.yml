server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: payment-platform

  datasource:
    postgres:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgrespassword}
      driver-class-name: org.postgresql.Driver
    mysql:
      url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:payment_historian_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQL_USERNAME:mysqluser}
      password: ${MYSQL_PASSWORD:mysqlpassword}
      driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    show-sql: false

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

webhook:
  secret: ${WEBHOOK_SECRET:test_shared_webhook_secret_key_123}

payment:
  reconciliation:
    interval-ms: 30000
    timeout-minutes: 2
